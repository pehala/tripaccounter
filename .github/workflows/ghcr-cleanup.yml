name: ghcr-cleanup

# Every push to main moves `latest` and leaves the previous image behind as an
# untagged version; GHCR never garbage-collects those. Only `latest` is kept.
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Safe only because the image is single-arch: a multi-arch `latest` is an
      # untagged index over untagged per-platform manifests, and this would delete them.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 0
