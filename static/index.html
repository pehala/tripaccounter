<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Accounter</title>

<script>
  // Applied before any stylesheet loads so a full page load never paints the
  // wrong theme first — every tab is its own page load, so this runs every time.
  (function () {
    var theme = localStorage.getItem('theme');
    if (theme) document.documentElement.dataset.bsTheme = theme;
  })();
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"
      integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
<link href="/app.css" rel="stylesheet">

<script type="importmap">
{ "imports": {
  "preact":       "https://cdn.jsdelivr.net/npm/preact@10.29.8/dist/preact.module.js",
  "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.29.8/hooks/dist/hooks.module.js",
  "htm":          "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js"
}}
</script>

<!-- The three import-map modules sit at the far end of the import graph: the browser
     only discovers them once every local module has parsed, and the first API call
     waits on them. Preloading starts all three with the document, and carries the
     integrity the import map itself has no way to state. -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/preact@10.29.8/dist/preact.module.js"
      integrity="sha384-/+qYo5nYND9OqrXEuD1TAQve92IcrX0NRO0UL3OhOo4n0PKMsi5hsMdezdy76IvB" crossorigin="anonymous">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/preact@10.29.8/hooks/dist/hooks.module.js"
      integrity="sha384-NB1WUh14K2Oh7NhjB2RliXB085nezUjZ+FNbCEGNeb972g+I4CjKRx+u3vbZh227" crossorigin="anonymous">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js"
      integrity="sha384-k7/PyxcXOQ/zfJq1v0TM/CcBLQ2m2NzGg2tfHehdgJGqcY7RBwIP4Ye+ssG+QK1I" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
